name: Deploy to VPS (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: nitip-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Secrets File
        run: |
          cp ~/.secret/nitip-production.env .env
          cp ~/.secret/firebase-credentials.json ./firebase-credentials.json || true
          cp ~/.secret/dozzle-users.yml ./users.yml || true

      - name: Build Docker Image
        run: |
          docker compose build app

      - name: Run Database Migrations
        run: |
          docker compose run --rm app /app/migrate up

      - name: Deploy Application
        run: |
          docker compose up -d --remove-orphans

      - name: Cleanup Docker
        run: |
          # Hapus image yang tidak digunakan
          docker image prune -f

          # Hapus build cache yang lebih tua dari 72 jam
          docker builder prune --filter "until=72h" -f

          # Hapus network yang tidak digunakan
          docker network prune -f

          # Tampilkan ringkasan penggunaan Docker
          docker system df