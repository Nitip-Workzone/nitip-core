name: Deploy to VPS (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: nitip-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Secrets File
        run: |
          cp ~/.secret/nitip-production.env .env
          cp ~/.secret/firebase-credentials.json ./firebase-credentials.json || true
          cp ~/.secret/dozzle-users.yml ./users.yml || true
          chmod 600 .env || true

      - name: Build Docker Image
        run: |
          docker compose build app

      - name: Run Database Migrations
        run: |
          docker compose run --rm app /app/migrate up

      - name: Deploy Application
        run: |
          docker compose up -d --remove-orphans

      - name: Cleanup Docker
        run: |
          docker image prune -f
          docker builder prune --filter "until=72h" -f
          docker network prune -f
          docker system df
          rm -f .env || true
